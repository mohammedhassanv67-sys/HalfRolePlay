<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HalfRolePlay - Chat</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/chat.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/theme-switcher.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <img src="assets/images/logo.png" alt="HalfRolePlay">
                <span>Half<span>RolePlay</span></span>
            </div>
        </div>

        <div class="sidebar-user" id="sidebarUser">
            <div class="sidebar-user-content hidden" id="sidebarUserContent">
                <img src="assets/images/user-avatar.png" alt="User" class="sidebar-user-avatar" id="sidebarAvatar">
                <div class="sidebar-user-info">
                    <div class="sidebar-user-name" id="sidebarUsername">Guest</div>
                    <div class="sidebar-user-rank" id="sidebarRank">Not logged in</div>
                </div>
            </div>
            <div class="sidebar-guest" id="sidebarGuest">
                <i class="fas fa-user-circle"></i>
                <span>Guest</span>
            </div>
        </div>

        <div class="sidebar-auth">
            <button class="btn-login" id="sidebarLoginBtn" onclick="window.location.href='/auth/discord'">
                <i class="fab fa-discord"></i> Login
            </button>
            <div class="user-info-sidebar hidden" id="sidebarUserInfo">
                <button class="btn-logout" onclick="window.location.href='/auth/logout'">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>

        <nav class="sidebar-links">
            <a href="/index.html" class="sidebar-link active"><i class="fas fa-home"></i><span>الرئيسية</span></a>
            <a href="/shop.html" class="sidebar-link"><i class="fas fa-store"></i><span>المتجر</span></a>
            <a href="/chat.html" class="sidebar-link"><i class="fas fa-comments"></i><span>الدردشة</span></a>
            <a href="/apply.html" class="sidebar-link"><i class="fas fa-file-alt"></i><span>تقديم على الادارة</span></a>
            <a href="/server-status.html" class="sidebar-link"><i class="fas fa-server"></i><span>حالة السيرفر</span></a>
            <a href="/dashboard.html" class="sidebar-link"><i class="fas fa-user"></i><span>لوحة التحكم</span></a>
            <a href="/admin.html" class="sidebar-link" id="sidebarAdminLink" style="display:none;"><i class="fas fa-shield-alt"></i><span>لوحة الادمن</span></a>
        </nav>

        <div class="sidebar-footer">
            <div class="sidebar-social">
                <a href="$https://discord.gg/HalfRp" target="_blank"><i class="fab fa-discord"></i></a>
            </div>
            <p>&copy; 2026 HalfRolePlay</p>
        </div>
    </aside>

    <main class="main-content">
        <button class="sidebar-toggle-mobile" onclick="toggleSidebarMobile()">
            <i class="fas fa-bars"></i>
        </button>

        <section class="chat-section">
            <div class="chat-container">
                <div class="chat-header">
                    <div class="chat-header-left">
                        <i class="fas fa-comments"></i>
                        <h2>Server Chat</h2>
                        <span class="online-count" id="onlineCount">0 online</span>
                    </div>
                    <div class="chat-header-right">
                        <button class="btn-refresh-chat" onclick="loadMessages()" title="Refresh">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                    </div>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <div class="chat-loading">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>Connecting to chat...</p>
                    </div>
                </div>

                <div class="chat-input-area" id="chatInputArea">
                    <div class="chat-login-prompt" id="chatLoginPrompt">
                        <i class="fas fa-lock"></i>
                        <span>Please <a href="/auth/discord">login</a> to chat</span>
                    </div>
                    <div class="chat-input-wrapper hidden" id="chatInputWrapper">
                        <textarea id="chatInput" placeholder="Type a message..." rows="1" maxlength="200" onkeydown="handleChatKey(event)"></textarea>
                        <button class="btn-send" onclick="sendMessage()" id="sendBtn">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/main.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/theme-switcher.js"></script>
</body>
</html>
