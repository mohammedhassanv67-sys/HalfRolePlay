<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found | HalfRolePlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #08080f;
            color: #fff;
            font-family: 'Tajawal', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container { max-width: 500px; }
        .emoji { font-size: 80px; margin-bottom: 20px; }
        h1 { font-size: 28px; font-weight: 800; margin-bottom: 10px; color: #7c3aed; }
        p { font-size: 16px; color: #888899; line-height: 1.8; }
        .btn {
            display: inline-block;
            margin-top: 24px;
            padding: 14px 32px;
            background: linear-gradient(135deg, #7c3aed, #5b21b6);
            color: #fff;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            transition: all 0.3s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(124, 58, 237, 0.3); }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">404</div>
        <h1>مافيش حاجة يباشا</h1>
        <p>لا تدور على الفاضي، الصفحة دي مش موجودة.</p>
        <a href="/" class="btn">الرجوع للرئيسية</a>
    </div>
</body>
</html>
